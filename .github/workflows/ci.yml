name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main", "feature/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.11 with uv
        run: uv python install 3.11

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Create minimal .env for CI
        run: |
          echo "ENVIRONMENT=ci" > .env
          echo "STORAGE_REGION=us-east-1" >> .env
          echo "STORAGE_BUCKET_NAME=test-bucket" >> .env
          echo "AWS_ACCESS_KEY_ID=test" >> .env
          echo "AWS_SECRET_ACCESS_KEY=test" >> .env

      - name: Ruff Lint
        continue-on-error: true
        uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github .

      - name: Ruff Format Check
        continue-on-error: true
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check .

      - name: Run pytest
        env:
          CI: true
          PYTHONPATH: src
        run: uv run python -m pytest

      - name: Build Docker image
        run: docker build -t my-app:${{ github.sha }} .
